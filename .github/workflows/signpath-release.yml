# SignPath 开源代码签名 —— GitHub Actions 工作流模板
#
# 使用前提：
#   1. 仓库公开托管在 github.com（SignPath 的 GitHub 连接器只认 GitHub.com；
#      自建 Gitea 不适用）；
#   2. 已通过 SignPath 开源计划审核，并在控制台建好 project / signing policy /
#      artifact configuration，拿到 API Token；
#   3. 仓库 Secrets 里配置 SIGNPATH_API_TOKEN，Variables 里配置
#      SIGNPATH_ORGANIZATION_ID；
#   4. 已安装 SignPath GitHub App 到该仓库（用于构建来源审计）。
#
# 用法：把本文件复制到 .github/workflows/signpath-release.yml，
#       然后 `git tag v1.0.1 && git push origin v1.0.1`。
#
# 说明：electron-builder 这里不配任何证书，签名在构建完成后交给 SignPath 做。

name: Release (signed)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 私有仓库 + 默认权限时需要显式声明（公开仓库可省略）
permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Build unsigned installers
    # SignPath 参数未配置前自动跳过，避免打 tag 时产生失败记录
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "value=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Package (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # 显式关闭本地证书探测
        run: npx electron-builder --win nsis portable

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Copy-Item release/HongSSH-*-setup.exe unsigned/
          Copy-Item release/HongSSH-*-portable.exe unsigned/
          Get-ChildItem unsigned | Select-Object Name, Length

      # upload-artifact 会把上传内容打成 ZIP，这正是下方 artifact configuration
      # 里 <zip-file> 根元素所需要的
      - name: Upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installers
          path: unsigned/*.exe
          if-no-files-found: error

  sign:
    name: Sign with SignPath
    needs: build
    runs-on: windows-latest
    steps:
      - name: Submit signing request
        id: sign
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: hong-ssh                 # 控制台里的 Project slug
          signing-policy-slug: release-signing   # 控制台里的 Signing Policy slug
          artifact-configuration-slug: installers # 控制台里的 Artifact Configuration slug
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          # 传给 artifact configuration 的 version 参数（用于元数据约束校验）
          parameters: |
            version: "${{ needs.build.outputs.version }}"

      - name: Show signed files
        shell: pwsh
        run: Get-ChildItem signed -Recurse | Select-Object FullName, Length

      # 可选：把签名后的文件发布到 GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: signed/**/*.exe
          fail_on_unmatched_files: true
