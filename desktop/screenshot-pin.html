<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HongSSH 贴图</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      * {
        box-sizing: border-box;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111318;
      }
      body {
        -webkit-app-region: drag;
        cursor: move;
      }
      img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: fill;
        pointer-events: none;
      }
      .close {
        -webkit-app-region: no-drag;
        position: fixed;
        z-index: 20;
        top: 6px;
        right: 6px;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #f4f6fa;
        font-size: 18px;
        font-weight: 600;
        line-height: 1;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        cursor: pointer;
        opacity: 0;
      }
      body:hover .close,
      body.show-close .close {
        opacity: 1;
      }
      .close:hover {
        background: transparent;
        border-color: transparent;
        color: #ff5a5f;
      }
    </style>
  </head>
  <body>
    <img id="image" alt="贴图" draggable="false" />
    <button class="close" id="close" type="button" title="关闭贴图">×</button>
    <script src="screenshot-pin.js"></script>
  </body>
</html>
