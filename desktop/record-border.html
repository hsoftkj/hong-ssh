<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>录制区域</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }
      .frame {
        position: fixed;
        inset: 0;
        border: 3px solid rgba(255, 82, 82, 0.96);
        border-radius: 3px;
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.35),
          0 0 0 1px rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
  </body>
</html>
